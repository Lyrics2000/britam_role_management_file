############################################################################
# DEPRECATED — this file is no longer used.
#
# It configured the nginx container that used to run alongside the app. That
# container was removed from docker-compose.yml; nginx now runs on the host.
#
# The replacement is  nginx-host.conf  in this directory — copy that onto the
# droplet (instructions are in its header and in README.md).
#
# This file is safe to delete. It is left here only so an existing deployment
# that still references ./nginx.conf in a bind mount does not break silently.
############################################################################

server {
    listen 80;
    server_name _;

    # Anyone reaching this is running the old sidecar. Point them at the app.
    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://web:8000;
    }
}
