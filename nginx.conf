############################################################################
# Reverse proxy in front of gunicorn.
#
# Changed from the previous static-file config: nginx no longer holds the
# site's content, it forwards to the `web` service. It still terminates the
# connection, adds security headers, gzips, and now rate-limits.
############################################################################

# Rate limit zones. 10m of shared memory tracks ~160k addresses.
#   general — normal browsing, generous
#   write   — POST/PUT/PATCH/DELETE, tight, since these hit SQLite's writer
#   login   — brute-force protection on the sign-in form
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=write:10m   rate=2r/s;
limit_req_zone $binary_remote_addr zone=login:10m   rate=12r/m;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

upstream britam_app {
    # `web` resolves on the compose network. keepalive reuses connections
    # instead of a fresh TCP handshake per request.
    server web:8000 max_fails=3 fail_timeout=15s;
    keepalive 16;
}

map $request_method $is_write {
    default 0;
    POST    1;
    PUT     1;
    PATCH   1;
    DELETE  1;
}

server {
    listen 80;
    server_name _;

    # Uploaded role text is a few KB; 2 MB is generous and stops a
    # multi-gigabyte body from filling the disk.
    client_max_body_size 2m;
    client_body_timeout 20s;
    client_header_timeout 20s;
    send_timeout 30s;

    limit_conn conn_per_ip 24;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 256;

    # Correlation id shared with Django (see roles/middleware.py).
    # $request_id is nginx's own per-request uuid.
    proxy_set_header X-Request-ID $request_id;
    add_header X-Request-ID $request_id always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_redirect off;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    # 65s: longer than the AI proxy's 45s upstream timeout, so a slow
    # assistant answer returns rather than being cut off by nginx.
    proxy_read_timeout 65s;

    # Security headers. Note X-Frame-Options SAMEORIGIN is kept from the
    # original config; Django sets it too, and duplicates are harmless.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    server_tokens off;

    # --- health -----------------------------------------------------------
    location = /healthz {
        access_log off;
        proxy_pass http://britam_app;
    }

    location = /readyz {
        access_log off;
        proxy_pass http://britam_app;
    }

    # --- static assets ----------------------------------------------------
    # Served by WhiteNoise inside the app (see ADR-004 in settings.py), but
    # cached hard here. Filenames are content-hashed by ManifestStaticFiles,
    # so a year is safe.
    location /static/ {
        proxy_pass http://britam_app;
        proxy_cache_valid 200 7d;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- sign in ----------------------------------------------------------
    location = /accounts/login/ {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://britam_app;
    }

    # --- api --------------------------------------------------------------
    location /api/ {
        limit_req zone=general burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://britam_app;
    }

    # The AI endpoint costs money per call; keep it on the tight bucket
    # regardless of method.
    location = /api/ai/ {
        limit_req zone=write burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://britam_app;
    }

    # --- everything else --------------------------------------------------
    location / {
        limit_req zone=general burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://britam_app;
    }

    # Do not leak the upstream's default error pages.
    proxy_intercept_errors off;
}
