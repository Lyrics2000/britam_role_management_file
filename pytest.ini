[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
testpaths = roles/tests
addopts =
    -q
    --strict-markers
    --disable-warnings
    --cov=roles
    --cov-report=term-missing:skip-covered
    --cov-fail-under=75
markers =
    integration: exercises the full request/response cycle against the database
