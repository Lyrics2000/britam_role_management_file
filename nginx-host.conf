############################################################################
# Britam Group Role Library — server block for the nginx running ON THE HOST.
#
# This file is NOT used by docker compose. Copy it onto the droplet:
#
#   sudo cp nginx-host.conf /etc/nginx/sites-available/britam-roles
#   sudo ln -s /etc/nginx/sites-available/britam-roles /etc/nginx/sites-enabled/
#   sudo nginx -t          # must print "syntax is ok" / "test is successful"
#   sudo systemctl reload nginx
#
# On RHEL/Alma/Rocky there is no sites-available; drop it in
# /etc/nginx/conf.d/britam-roles.conf instead.
#
# The compose stack listens on 127.0.0.1:6519 only, so this proxy is the sole
# way in. Adjust `server_name` and the upstream port to match your .env.
############################################################################

# ---------------------------------------------------------------------------
# Rate limit zones.
#
# These MUST live at http{} level, not inside server{}. If you put this file in
# conf.d/ they are already at the right level. If you paste the server block
# into an existing file, move these three lines up into /etc/nginx/nginx.conf
# inside http{}, or nginx will refuse to start with
#   "limit_req_zone directive is not allowed here".
#
# Names are prefixed `britam_` so they cannot collide with zones another site
# on this droplet has already defined.
# ---------------------------------------------------------------------------
limit_req_zone  $binary_remote_addr zone=britam_general:10m rate=30r/s;
limit_req_zone  $binary_remote_addr zone=britam_write:10m   rate=2r/s;
limit_req_zone  $binary_remote_addr zone=britam_login:10m   rate=12r/m;
limit_conn_zone $binary_remote_addr zone=britam_conn:10m;

upstream britam_roles {
    server 127.0.0.1:6519 max_fails=3 fail_timeout=15s;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;

    # CHANGE THIS. Must also appear in DJANGO_ALLOWED_HOSTS in .env.
    server_name roles.example.com;

    # --- request limits ---------------------------------------------------
    client_max_body_size 2m;
    client_body_timeout 20s;
    client_header_timeout 20s;
    send_timeout 30s;
    limit_conn britam_conn 24;

    # --- compression ------------------------------------------------------
    # The app also gzips (DJANGO_GZIP). Whichever compresses first wins; nginx
    # passes an already-encoded response through untouched.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 256;

    # --- proxy headers ----------------------------------------------------
    #
    # $http_host, NOT $host. $host drops the port, so a browser on
    # http://example.com:6519 sends `Origin: http://example.com:6519` while
    # Django rebuilds its own origin from Host as `http://example.com`. Django
    # compares the two on every POST and rejects the mismatch with
    # "CSRF verification failed" — which makes the login form unusable.
    #
    # If you terminate on port 80/443 (no port in the URL), $host and
    # $http_host are equivalent and either works. $http_host is correct in
    # both cases, so use it.
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Request-ID      $request_id;
    add_header       X-Request-ID      $request_id always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_redirect off;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    # Longer than the app's 45s Anthropic timeout, so a slow AI answer returns
    # rather than being cut off here.
    proxy_read_timeout 65s;

    # --- security headers -------------------------------------------------
    # The app sets these too; duplicates are harmless and this keeps the
    # posture correct even if someone runs the container without a proxy.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    server_tokens off;

    # --- health probes ----------------------------------------------------
    location = /healthz {
        access_log off;
        proxy_pass http://britam_roles;
    }

    location = /readyz {
        access_log off;
        proxy_pass http://britam_roles;
    }

    # --- static assets ----------------------------------------------------
    # Served by WhiteNoise inside the app with content-hashed filenames, so a
    # long cache is safe.
    location /static/ {
        proxy_pass http://britam_roles;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- sign in ----------------------------------------------------------
    # Second layer only: the application enforces its own per-IP and
    # per-username limits (roles/auth_views.py), so brute-force protection does
    # not depend on this block being present.
    location = /accounts/login/ {
        limit_req zone=britam_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://britam_roles;
    }

    # --- AI endpoint ------------------------------------------------------
    # Costs money per call; keep it on the tight bucket.
    location = /api/ai/ {
        limit_req zone=britam_write burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://britam_roles;
    }

    # --- api --------------------------------------------------------------
    location /api/ {
        limit_req zone=britam_general burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://britam_roles;
    }

    # --- everything else --------------------------------------------------
    location / {
        limit_req zone=britam_general burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://britam_roles;
    }

    proxy_intercept_errors off;
}

############################################################################
# HTTPS
#
# The quickest route on Ubuntu/Debian:
#
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d roles.example.com
#
# certbot rewrites the block above to listen on 443 and adds an HTTP->HTTPS
# redirect. Afterwards, set these in .env and `docker compose up -d`:
#
#   DJANGO_BEHIND_TLS_PROXY=1
#   DJANGO_SECURE_SSL_REDIRECT=1
#   PUBLIC_PORT=                      # blank: the site is now on 443
#   DJANGO_ALLOWED_HOSTS=roles.example.com
#
# Setting DJANGO_BEHIND_TLS_PROXY=1 before the certificate exists makes the
# session cookie secure-only, and sign-in will appear to fail silently.
############################################################################
