############################################################################
# Britam Group Role Library — Django + SQLite behind nginx.
#
#   docker compose up -d --build
#
# On first boot the `web` container migrates, then loads every role from
# Britam_Role_Library.html into SQLite. The site then reads from SQLite, and
# staff can edit or add roles through the Manage tab and /admin/.
#
# The site is published on host port 6519, as before.
############################################################################

networks:
  # ADR: kept `external: true` to match the existing droplet setup, where
  # other stacks already share this network. Create it once with:
  #     docker network create app-network
  app-network:
    external: true

volumes:
  # The SQLite file. A named volume, not a bind mount: the container runs as
  # uid 10001 and a bind-mounted host directory would land root-owned and make
  # the database read-only. Back it up with the command in README.md.
  britam_role_data:
    name: britam_role_data

services:
  britam_role_mng:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
    image: britam-role-library:${APP_VERSION:-1.0.0}
    restart: unless-stopped
    networks:
      - app-network
    # No ports: — the app is only reachable through nginx below. Publishing
    # 8000 as well would expose gunicorn directly and bypass the proxy's
    # rate limits and headers.
    expose:
      - "8000"
    volumes:
      - britam_role_data:/data
    env_file:
      - .env
    environment:
      DJANGO_SQLITE_PATH: /data/db.sqlite3
      DJANGO_STATIC_ROOT: /app/staticfiles
      SEED_HTML_PATH: /app/Britam_Role_Library.html
      # once = seed only when the database is empty (HR edits survive restarts)
      # sync = re-read the HTML on every boot
      SEED_MODE: ${SEED_MODE:-once}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          # 64m was fine for nginx serving one file; Django + 3 gunicorn
          # workers needs ~300 MB. Setting this too low gets the container
          # OOM-killed mid-request with no log line explaining why.
          memory: 512m
        reservations:
          memory: 192m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  britam_role_mng_nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      britam_role_mng:
        condition: service_healthy
    networks:
      - app-network

    ports:
      # host:container — unchanged from the previous deployment
      - "6519:80"


    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./:/app
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    security_opt:
      - no-new-privileges:true
