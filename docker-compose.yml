############################################################################
# Britam Group Role Library — Django + SQLite, single container.
#
# There is no nginx service here — nginx runs on the host and proxies to this
# container. A ready server block is in nginx-host.conf.
#
# WHERE IS IT LISTENING?
#   PUBLISH_ADDRESS in .env decides, default 127.0.0.1:
#     127.0.0.1  only this machine can connect (correct once host nginx is in
#                front). http://localhost:6519 works ON this machine; from
#                another machine you reach it through nginx on port 80.
#     0.0.0.0    reachable from anywhere, e.g. http://10.10.4.103:6519.
#                Handy while testing; see the note on ports: below.
#
#   docker compose up -d --build
#
# On first boot the  container migrates, then loads every role from
# Britam_Role_Library.html into SQLite. The site then reads from SQLite, and
# staff can edit or add roles through the Manage tab and /admin/.
#
# The site is published on host port 6519, as before.
############################################################################

networks:
  # ADR: kept `external: true` to match the existing droplet setup, where
  # other stacks already share this network. Create it once with:
  #     docker network create app-network
  app-network:
    external: true

volumes:
  # The SQLite file. A named volume, not a bind mount: the container runs as
  # uid 10001 and a bind-mounted host directory would land root-owned and make
  # the database read-only. Back it up with the command in README.md.
  britam_role_data:
    name: britam_role_data

services:
  britam_role_mng:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
    image: britam-role-library:${APP_VERSION:-1.0.0}
    restart: unless-stopped
    networks:
      - app-network
    ports:
      ######################################################################
      # THIS is what was missing. With only `expose:` and no `ports:`, the
      # container listens on 8000 inside the compose network and nothing is
      # mapped to the host, so a browser cannot reach it. That was fine while
      # the nginx sidecar proxied to it; with the sidecar gone, the mapping
      # has to live here.
      #
      # ADR-018: the host side defaults to 127.0.0.1, not 0.0.0.0. Docker
      # publishes ports by writing iptables rules consulted BEFORE ufw's, so
      # a bare "6519:8000" is reachable from the internet even with
      # `ufw deny 6519` set. gunicorn's sync workers also do not buffer slow
      # requests, so exposing them directly invites slowloris.
      #
      # PUBLISH_ADDRESS=0.0.0.0 in .env opens it up for testing. Set
      # DJANGO_TRUST_PROXY_HEADERS=0 while it is open, or anyone can forge
      # X-Forwarded-For and walk through the rate limits.
      ######################################################################
      - "${PUBLISH_ADDRESS:-127.0.0.1}:${PUBLIC_PORT:-6519}:8000"
    volumes:
      - britam_role_data:/data
    env_file:
      - .env
    environment:
      DJANGO_SQLITE_PATH: /data/db.sqlite3
      DJANGO_STATIC_ROOT: /app/staticfiles
      SEED_HTML_PATH: /app/Britam_Role_Library.html
      # once = seed only when the database is empty (HR edits survive restarts)
      # sync = re-read the HTML on every boot
      SEED_MODE: ${SEED_MODE:-once}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          # 64m was fine for nginx serving one file; Django + 3 gunicorn
          # workers needs ~300 MB. Setting this too low gets the container
          # OOM-killed mid-request with no log line explaining why.
          memory: 512m
        reservations:
          memory: 192m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    # security_opt:
    #   - no-new-privileges:true

 